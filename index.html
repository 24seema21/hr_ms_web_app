<!doctype html>
<!-- `lang` tells a screen reader which pronunciation rules to use, and the
     browser which language to offer to translate from. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarkHR — the register your whole HR team writes in</title>
    <meta
      name="description"
      content="HarkHR is an HR management system for growing teams: one employee record read by directory, attendance, leave, payroll, performance and reporting."
    />
    <!-- Matches --color-brand-900: the browser chrome on Android and the iOS
         status bar tint to the same ink green as the product. -->
    <meta name="theme-color" content="#0b2f2a" />

    <!--
      Typefaces, in two roles (see the comment block in src/index.css).

      `preconnect` opens the TCP + TLS handshake to both font hosts while the
      HTML is still parsing, which is worth ~100-300ms on a cold load. The
      second one needs `crossorigin` because font *files* are fetched as CORS
      requests, and a preconnect without it opens a connection that the real
      request cannot reuse.

      `display=swap` renders the fallback face immediately and swaps when the
      webfont lands — the alternative is up to three seconds of invisible text.
      The stacks in @theme name close system fallbacks so that swap is a small
      shift rather than a reflow of the whole page.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Theme, applied before the first paint.

      This has to be a blocking, inline, *classic* script in the body — not the
      module below, which is deferred by definition and therefore runs after
      the browser has already painted. Without it, somebody who chose dark gets
      a full white page for a frame or two before React mounts and corrects it,
      which at night is genuinely unpleasant and looks like a bug.

      Deliberately duplicated logic rather than an import: a module would be
      deferred and defeat the entire point. It is kept to the two lines that
      must not drift — the storage key and the attribute — both of which are
      documented in src/shared/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('harkhr.theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
          // No attribute otherwise: the prefers-color-scheme block in
          // index.css already handles "follow the OS", with no JS involved.
        } catch (error) {
          // Private mode and blocked storage both throw. The OS preference
          // still applies, so there is nothing to recover from.
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
